name: CI

on:
    push:
        branches:
            - main
    pull_request:
        paths-ignore:
            - 'docs/*'
            - '*.yml'
            - '*.md'
            - 'LICENSE'

permissions:
    contents: read

jobs:
    build:
        name: Test
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22, 24]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: |
                  npx tsc --noEmit
                  npx tsc -p tests
                  npx tsc -p bench

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify dist output
              run: |
                  test -f dist/index.js || { echo "dist/index.js not found"; exit 1; }
                  test -f dist/index.d.ts || { echo "dist/index.d.ts not found"; exit 1; }
                  echo "Build output OK"

    gpu:
        name: GPU smoke test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # No GPU on the runners: Mesa's lavapipe is a software Vulkan
            # driver, enough for Deno's WebGPU (wgpu) to run everything
            - name: Install software Vulkan driver
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -y -q mesa-vulkan-drivers

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Run GPU smoke test
              env:
                  GPU_REQUIRED: 1
              run: deno run --unstable-webgpu --unstable-sloppy-imports --allow-env --allow-read tests/gpu/smoke.ts
