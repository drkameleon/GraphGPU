name: Benchmarks

on:
    pull_request:
        paths:
            - 'src/**'
            - 'bench/**'
            - 'tests/helpers.ts'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/bench.yml'

permissions:
    contents: read

jobs:
    bench:
        name: Benchmark
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Compare against base
              run: |
                  set -o pipefail
                  bash bench/ab.sh ${{ github.event.pull_request.base.sha }} 3 | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: benchmarks
                  path: bench-*.json
                  if-no-files-found: ignore
